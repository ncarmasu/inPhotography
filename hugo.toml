copyright = "© INPhotography"
defaultContentLanguage = "ro"
defaultContentLanguageInSubdir = false
disableKinds = ["taxonomy"]
enableRobotsTXT = true
timeZone = "Europe/Bucharest"
timeout = "120s"
title = "INPhotography"
theme = "gallery"

[languages]
  [languages.ro]
    locale = "ro_RO"
    label = "Română"
    weight = 1
    title = "INPhotography"
    [languages.ro.params]
      description = "Fotografie profesională — evenimente corporate, portrete și street."
  [languages.en]
    locale = "en_US"
    label = "English"
    weight = 2
    title = "INPhotography"
    [languages.en.params]
      description = "Professional photography — corporate events, portraits and street."

[params]
  defaultTheme = "dark"
  [params.author]
    email = "inphotography@gmail.com"
    name = "Narcis"
  [params.socialIcons]
    instagram = "https://www.instagram.com/inphotography.ro"
    whatsapp = "40745560706"
    email = "mailto:inphotography@gmail.com"
  [params.gallery]
    targetRowHeight = 320

[outputs]
  home = ["HTML", "RSS"]
  page = ["HTML"]
  section = ["HTML"]

[imaging]
  quality = 80
  resampleFilter = "CatmullRom"
  [imaging.exif]
    disableDate = false
    disableLatLong = true
    includeFields = "ImageDescription|Orientation"

[services]
  [services.rss]
    limit = 100

[languages.ro.menu]
  [[languages.ro.menu.main]]
    name = "Portofoliu"
    url = "/portofoliu/"
    weight = 5
  [[languages.ro.menu.main]]
    name = "Servicii"
    url = "/servicii/"
    weight = 7
  [[languages.ro.menu.main]]
    name = "Despre"
    url = "/about/"
    weight = 10
  [[languages.ro.menu.main]]
    name = "Contact"
    url = "/contact/"
    weight = 20
  [[languages.ro.menu.main]]
    name = "EN"
    url = "/en/"
    weight = 99

[languages.en.menu]
  [[languages.en.menu.main]]
    name = "Portfolio"
    url = "/en/portofoliu/"
    weight = 5
  [[languages.en.menu.main]]
    name = "Services"
    url = "/en/servicii/"
    weight = 7
  [[languages.en.menu.main]]
    name = "About"
    url = "/en/about/"
    weight = 10
  [[languages.en.menu.main]]
    name = "Contact"
    url = "/en/contact/"
    weight = 20
  [[languages.en.menu.main]]
    name = "RO"
    url = "/"
    weight = 99

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
