<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Montserrat:wght@300;400;500&display=swap" rel="stylesheet" />

<style>
  /* True black background for photo work */
  :root, html.dark { --surface-1-dark: #000; --surface-2-dark: #1a1a1a; }

  /* Brand wordmark in header — Montserrat (different from Cormorant used elsewhere) */
  body > header { padding: 0.5rem 1.5rem; max-width: 1280px; margin-left: auto; margin-right: auto; }
  body > header .header-left { display: inline-flex; align-items: center; gap: 0.75rem; }
  body > header .brand-mark-header {
    font-family: "Montserrat", -apple-system, "Helvetica Neue", Arial, sans-serif !important;
    font-weight: 400;
    font-size: 1.05rem;
    letter-spacing: 0.12em;
    text-decoration: none;
    line-height: 1;
    display: inline-flex; align-items: center; gap: 0.55rem;
  }
  body > header .brand-mark-header .brand-mark-icon {
    width: 26px; height: 26px; display: block; color: var(--text-1);
  }
  body > header .brand-mark-header:hover { text-decoration: none; opacity: 0.7; }

  /* Desktop inline header navigation */
  body > header .header-nav { display: none; gap: 1.5rem; align-items: center; margin-left: auto; }
  body > header .header-nav a {
    font-family: "Montserrat", -apple-system, "Helvetica Neue", Arial, sans-serif;
    font-size: 0.95rem;
    letter-spacing: 0.06em;
    text-decoration: none;
    padding: 0.4rem 0.2rem;
  }
  body > header .header-nav a:hover { opacity: 0.7; text-decoration: none; }
  @media (min-width: 768px) {
    body > header .header-nav { display: inline-flex; }
    body > header > ul { display: none; }  /* hide burger on desktop */
  }

  /* Footer CTA */
  body > footer .footer-cta {
    text-align: center;
    padding: 2rem 1rem;
    margin-bottom: 1.5rem;
    border-top: 1px solid rgba(128,128,128,0.2);
    border-bottom: 1px solid rgba(128,128,128,0.2);
  }
  body > footer .footer-cta-text {
    font-family: "Cormorant Garamond", Georgia, serif;
    font-size: clamp(1.4rem, 3vw, 2rem);
    font-weight: 300;
    font-style: italic;
    margin: 0 0 1rem;
    letter-spacing: 0.02em;
  }
  body > footer .footer-cta-btn {
    display: inline-block;
    padding: 0.7rem 1.5rem;
    border: 1px solid currentColor;
    border-radius: 6px;
    text-decoration: none;
    font-family: "Montserrat", -apple-system, sans-serif;
    font-size: 0.95rem;
    letter-spacing: 0.08em;
    transition: opacity 0.2s;
  }
  body > footer .footer-cta-btn:hover { opacity: 0.7; text-decoration: none; }

  /* Apply Cormorant to all page titles/headings (galleries, services, about, contact) */
  main hgroup h1,
  main h1, main h2, main h3 {
    font-family: "Cormorant Garamond", Georgia, serif;
    font-weight: 400;
    letter-spacing: 0.03em;
  }
  main hgroup h1 { font-weight: 300; letter-spacing: 0.05em; }
  main hgroup p { font-style: italic; opacity: 0.85; }

  /* Hero brand wordmark */
  .brand-hero {
    max-width: 1280px;
    margin: 1rem auto 1.5rem;
    padding: 0.5rem 1.5rem 1.5rem;
    text-align: center;
    font-family: "Cormorant Garamond", Georgia, serif;
  }
  .brand-hero .brand-logo {
    display: block;
    margin: 0 auto 0.5rem;
    width: 100%;
    max-width: 520px;
    height: auto;
  }
  .brand-hero .brand-mark {
    position: relative;
    display: inline-block;
    font-weight: 300;
    font-size: clamp(1.8rem, 5vw, 3.6rem);
    letter-spacing: 0.08em;
    line-height: 1;
    padding: 0 0.6em;
  }
  /* Median line through the wordmark */
  .brand-hero .brand-mark::before,
  .brand-hero .brand-mark::after {
    content: "";
    position: absolute;
    top: 50%;
    width: 22vw;
    max-width: 280px;
    height: 1px;
    background: currentColor;
    opacity: 0.55;
  }
  .brand-hero .brand-mark::before { right: 100%; }
  .brand-hero .brand-mark::after  { left:  100%; }
  .brand-hero .brand-tagline {
    margin: 0.7rem 0 0;
    font-style: italic;
    font-weight: 300;
    font-size: clamp(0.95rem, 1.4vw, 1.15rem);
    letter-spacing: 0.04em;
    opacity: 0.8;
  }
  @media (max-width: 720px) {
    .brand-hero .brand-mark::before,
    .brand-hero .brand-mark::after { width: 6vw; max-width: 60px; }
    .brand-hero .brand-mark { padding: 0 0.4em; letter-spacing: 0.06em; }
  }

  /* Featured portfolio (large card) */
  .featured-portfolio { margin: 1.5rem auto 2.5rem; max-width: 1280px; }
  .featured-portfolio .card { display: block; position: relative; overflow: hidden; border-radius: 8px; }
  .featured-portfolio .card figure { margin: 0; aspect-ratio: 16 / 9; }
  .featured-portfolio .card figure img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .featured-portfolio .card > div {
    position: absolute; left: 0; right: 0; bottom: 0;
    padding: 1.25rem 1.5rem;
    background: linear-gradient(to top, rgba(0,0,0,0.75), rgba(0,0,0,0));
    color: #fff;
  }
  .featured-portfolio .card h2 { margin: 0 0 0.25rem; font-size: 1.75rem; font-family: "Cormorant Garamond", Georgia, serif; font-weight: 400; letter-spacing: 0.04em; }
  .featured-portfolio .card p { margin: 0; opacity: 0.85; font-style: italic; }

  /* Categories row (3 in a row on desktop) — uniform 4:5 with smooth hover */
  .categories-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1rem; }
  .categories-row .card { transition: transform .4s ease, opacity .4s ease; }
  .categories-row .card:hover { transform: scale(1.02); opacity: .92; }
  .categories-row .card figure,
  .categories-row .card > img,
  .categories-row .card figure > img { aspect-ratio: 4 / 5 !important; width: 100%; object-fit: cover; }
  .categories-row .card h2 { font-family: "Cormorant Garamond", Georgia, serif; font-weight: 400; letter-spacing: 0.04em; }

  /* Featured card hover */
  .featured-portfolio .card { transition: opacity .4s ease; }
  .featured-portfolio .card:hover { opacity: .92; }
  .featured-portfolio .card figure img { transition: transform .6s ease; }
  .featured-portfolio .card:hover figure img { transform: scale(1.02); }

  @media (max-width: 720px) {
    .categories-row { grid-template-columns: 1fr; }
    .featured-portfolio .card figure { aspect-ratio: 4 / 3; }
    .featured-portfolio .card h2 { font-size: 1.25rem; }
  }

  /* Footer polish */
  body > footer { display: flex; flex-direction: column; align-items: center; gap: 1.25rem; padding: 2.5rem 1.5rem 2rem; }
  body > footer section.social-icons { margin: 0; gap: 1.75rem; }
  body > footer section.social-icons a { opacity: .85; transition: opacity .2s ease; }
  body > footer section.social-icons a:hover { opacity: 1; }
  body > footer > section:last-child {
    border-top: 1px solid rgba(255,255,255,0.08);
    padding-top: 1rem; margin-top: 0.5rem; width: 100%; max-width: 1280px;
    text-align: center; font-size: 0.8rem; opacity: 0.55;
    display: flex; gap: 1rem; justify-content: center; flex-wrap: wrap;
  }
</style>
