<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Montserrat:wght@300;400;500&display=swap" rel="stylesheet" />

<style>
  /* True black background for photo work */
  :root, html.dark { --surface-1-dark: #000; --surface-2-dark: #1a1a1a; }

  /* Brand wordmark in header — Montserrat (different from Cormorant used elsewhere) */
  body > header { padding: 0.5rem 1.5rem; max-width: 1280px; margin-left: auto; margin-right: auto; }
  body > header .header-left { display: inline-flex; align-items: center; gap: 0.75rem; }

    font-weight: 400;

    letter-spacing: 0.12em;
    text-decoration: none;
    line-height: 1;
    display: inline-flex; align-items: center; gap: 0.55rem;
  }
  body > header .brand-mark-header .brand-mark-icon {
    width: 26px; height: 26px; display: block; color: var(--text-1);
  }
  body > header .brand-mark-header:hover { text-decoration: none; opacity: 0.7; }

  /* Desktop inline header navigation */
  body > header .header-nav { display: none; gap: 1.5rem; align-items: center; margin-left: auto; }
  body > header .header-nav a {
    font-family: "Montserrat", -apple-system, "Helvetica Neue", Arial, sans-serif;
    font-size: 0.95rem;
    letter-spacing: 0.06em;
    text-decoration: none;
    padding: 0.4rem 0.2rem;

  }
  body > footer .footer-cta-text {
    font-family: "Cormorant Garamond", Georgia, serif;

    font-style: italic;
    margin: 0 0 1rem;
    letter-spacing: 0.02em;
  }
  body > footer .footer-cta-btn {
    display: inline-block;
    padding: 0.7rem 1.5rem;
    border: 1px solid currentColor;
    border-radius: 6px;
    text-decoration: none;
    font-family: "Montserrat", -apple-system, sans-serif;
    font-size: 0.95rem;
    letter-spacing: 0.08em;
    transition: opacity 0.2s;
  }
  body > footer .footer-cta-btn:hover { opacity: 0.7; text-decoration: none; }

  /* Apply Cormorant to all page titles/headings (galleries, services, about, contact) */

  main h1, main h2, main h3 {
    font-family: "Cormorant Garamond", Georgia, serif;
    font-weight: 400;
    letter-spacing: 0.03em;
  }
  main hgroup h1 { font-weight: 300; letter-spacing: 0.05em; }
  main hgroup p { font-style: italic; opacity: 0.85; }

  /* Hero brand wordmark */
  .brand-hero {
    max-width: 1280px;
    margin: 1rem auto 1.5rem;
    padding: 0.5rem 1.5rem 1.5rem;
    text-align: center;
    font-family: "Cormorant Garamond", Georgia, serif;
  }
  .brand-hero .brand-logo {
    display: block;
    margin: 0 auto 0.5rem;
    width: 100%;
    max-width: 520px;
    height: auto;
  }
  .brand-hero .brand-mark {
    position: relative;
    display: inline-block;
    font-weight: 300;
    font-size: clamp(1.8rem, 5vw, 3.6rem);
    letter-spacing: 0.08em;
    line-height: 1;
    padding: 0 0.6em;
  }
  /* Median line through the wordmark */
  .brand-hero .brand-mark::before,
  .brand-hero .brand-mark::after {
    content: "";
    position: absolute;
    top: 50%;
    width: 22vw;
    max-width: 280px;
    height: 1px;
    background: currentColor;
    opacity: 0.55;

  .brand-hero .brand-mark::before { right: 100%; }
  .brand-hero .brand-mark::after  { left:  100%; }

    margin: 0.7rem 0 0;
    font-style: italic;
    font-weight: 300;
    font-size: clamp(0.95rem, 1.4vw, 1.15rem);
    letter-spacing: 0.04em;
    opacity: 0.8;
  }
  @media (max-width: 720px) {
    .brand-hero .brand-mark::before,
    .brand-hero .brand-mark::after { width: 6vw; max-width: 60px; }
    .brand-hero .brand-mark { padding: 0 0.4em; letter-spacing: 0.06em; }
  }

  /* Featured portfolio (large card) */
  .featured-portfolio { margin: 1.5rem auto 3rem; max-width: 1280px; }
  .featured-portfolio__label {
    text-align: center;
    font-family: "Cormorant Garamond", Georgia, serif;
    font-style: italic;
    font-size: 0.95rem;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    opacity: 0.55;
    margin-bottom: 0.85rem;
  }
  .featured-portfolio .card { display: block; position: relative; overflow: hidden; border-radius: 8px; }
  .featured-portfolio .card figure {
    margin: 0; aspect-ratio: 16 / 9; position: relative;
  }
  .featured-portfolio .card figure img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .featured-portfolio .card > div { display: none; }
  /* Discreet "explore" arrow overlay — replaces the text CTA */
  .featured-portfolio .card figure::after,
  .service-card__media::after {
    content: "→";
    position: absolute;
    right: 0.85rem;
    bottom: 0.7rem;
    width: 2.1rem;
    height: 2.1rem;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: "Cormorant Garamond", Georgia, serif;
    font-size: 1.35rem;
    color: #fff;
    background: rgba(0,0,0,0.45);
    backdrop-filter: blur(4px);
    -webkit-backdrop-filter: blur(4px);
    border-radius: 50%;
    opacity: 0.85;
    transition: transform .35s ease, opacity .35s ease, background .35s ease;
    pointer-events: none;
  }
  .featured-portfolio .card:hover figure::after,
  .service-card:hover .service-card__media::after {
    opacity: 1;
    transform: translateX(3px);
    background: rgba(0,0,0,0.6);
  }

  /* Services row */
  .services-row { max-width: 1280px; margin: 0 auto 2rem; }
  .services-row__heading {
    text-align: center;
    font-family: "Cormorant Garamond", Georgia, serif;
    font-weight: 400;
    font-size: 1.6rem;
    letter-spacing: 0.08em;
    margin: 0 0 1.5rem;
    opacity: 0.85;
  }
  .services-row__grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 1.25rem;
  }
  .service-card {
    display: flex;
    flex-direction: column;
    border: 1px solid rgba(128,128,128,0.22);
    border-radius: 8px;
    overflow: hidden;
    text-decoration: none;
    color: inherit;
    transition: transform .35s ease, border-color .35s ease, box-shadow .35s ease;
    background: rgba(255,255,255,0.02);
  }
  .service-card:hover {
    transform: translateY(-3px);
    border-color: rgba(128,128,128,0.45);
    box-shadow: 0 6px 20px rgba(0,0,0,0.18);
  }
  .service-card__media { margin: 0; aspect-ratio: 4 / 3; overflow: hidden; position: relative; }
  .service-card__media img { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform .6s ease; }
  .service-card:hover .service-card__media img { transform: scale(1.04); }
  .service-card__body {
    padding: 1.1rem 1.25rem 1.25rem;
    display: flex;
    flex-direction: column;
    gap: 0.55rem;
    flex: 1;
  }
  .service-card__title {
    margin: 0;
    font-family: "Cormorant Garamond", Georgia, serif;
    font-weight: 400;
    font-size: 1.4rem;
    letter-spacing: 0.04em;
  }
  .service-card__desc {
    margin: 0;
    font-size: 0.92rem;
    line-height: 1.45;
    opacity: 0.78;
    flex: 1;
    display: -webkit-box;
    -webkit-line-clamp: 3;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }

  /* Featured card hover */
  .featured-portfolio .card { transition: opacity .4s ease; }
  .featured-portfolio .card:hover { opacity: .92; }
  .featured-portfolio .card figure img { transition: transform .6s ease; }
  .featured-portfolio .card:hover figure img { transform: scale(1.02); }

  @media (max-width: 720px) {
    .services-row__grid { grid-template-columns: 1fr; gap: 1rem; }
    .service-card { flex-direction: row; }
    .service-card__media { width: 38%; flex-shrink: 0; aspect-ratio: 1 / 1; }
    .service-card__body { padding: 0.9rem 1rem; }
    .service-card__title { font-size: 1.15rem; }
    .service-card__desc {
      font-size: 0.85rem;
      -webkit-line-clamp: unset;
      display: block;
      overflow: visible;
    }
    .featured-portfolio .card figure { aspect-ratio: 4 / 3; }
    /* Slightly smaller arrow on mobile */
    .featured-portfolio .card figure::after,
    .service-card__media::after {
      width: 1.8rem; height: 1.8rem; font-size: 1.15rem;
      right: 0.6rem; bottom: 0.55rem;
    }
  }

  /* Footer polish */
  body > footer { display: flex; flex-direction: column; align-items: center; gap: 1.25rem; padding: 2.5rem 1.5rem 2rem; }
  body > footer section.social-icons { margin: 0; gap: 1.75rem; }
  body > footer section.social-icons a { opacity: .85; transition: opacity .2s ease; }
  body > footer section.social-icons a:hover { opacity: 1; }
  body > footer > section:last-child {
    border-top: 1px solid rgba(255,255,255,0.08);
    padding-top: 1rem; margin-top: 0.5rem; width: 100%; max-width: 1280px;
    text-align: center; font-size: 0.8rem; opacity: 0.55;
    display: flex; gap: 1rem; justify-content: center; flex-wrap: wrap;
  }

  /* Print catalog (page /print) */
  .print-subnote {
    text-align: center;
    margin: -0.5rem 0 0;
    font-size: 0.92rem;
    font-style: italic;
    opacity: 0.75;
  }
  .print-subnote a { text-decoration: none; border-bottom: 1px solid currentColor; padding-bottom: 1px; }
  .print-subnote a:hover { opacity: 0.7; }
  .print-catalog {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
    gap: 2rem 1.75rem;
    margin: 2.5rem auto 1rem;
    max-width: 1280px;
    width: 100%;
  }
  .print-card {
    display: flex;
    flex-direction: column;
    gap: 0.75rem;
    background: none;
    border: none;
    padding: 0;
    text-align: left;
    color: inherit;
    cursor: pointer;
    font: inherit;
  }
  .print-card-img {
    display: block;
    overflow: hidden;
    background: #111;
    aspect-ratio: 4 / 5;
  }
  .print-card-img img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    transition: opacity .25s ease, transform .4s ease;
    display: block;
  }
  .print-card:hover .print-card-img img,
  .print-card:focus-visible .print-card-img img { opacity: .92; transform: scale(1.02); }
  .print-card-meta { padding: 0 0.15rem; display: flex; flex-direction: column; gap: 0.2rem; }
  .print-title {
    font-family: "Cormorant Garamond", Georgia, serif;
    font-weight: 400;
    font-style: italic;
    font-size: 1.4rem;
    letter-spacing: 0.02em;
    line-height: 1.2;
  }
  .print-edition {
    font-size: 0.72rem;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    opacity: 0.65;
  }

  /* Print modal */
  .print-modal[hidden] { display: none; }
  .print-modal {
    position: fixed; inset: 0; z-index: 1000;
    display: flex; align-items: center; justify-content: center;
    padding: 1.5rem;
  }
  .print-modal-backdrop {
    position: absolute; inset: 0;
    background: rgba(0,0,0,0.85);
    backdrop-filter: blur(6px);
    border: none; padding: 0; cursor: pointer;
  }
  .print-modal-dialog {
    position: relative;
    display: grid;
    grid-template-columns: minmax(0, 1.6fr) minmax(280px, 1fr);

    max-width: 1100px;
    width: 100%;
    max-height: calc(100vh - 3rem);
    background: #0a0a0a;
    border: 1px solid rgba(255,255,255,0.1);
    overflow: hidden;
  }
  .print-modal-image-wrap {
    background: #000;
    display: flex; align-items: center; justify-content: center;
    overflow: hidden;
    min-height: 50vh;
  }
  .print-modal-image {
    max-width: 100%; max-height: calc(100vh - 3rem);
    width: auto; height: auto;
    object-fit: contain;
    display: block;
  }
  .print-modal-info {
    padding: 2rem 1.75rem;
    display: flex; flex-direction: column;
    overflow-y: auto;
  }
  .print-modal-title {
    font-family: "Cormorant Garamond", Georgia, serif;
    font-weight: 400; font-style: italic;
    font-size: 2rem; line-height: 1.1;
    margin: 0 0 0.5rem;
    letter-spacing: 0.02em;
  }
  .print-modal-edition {
    font-size: 0.78rem;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    opacity: 0.7;
    margin: 0 0 1.5rem;
  }
  .print-modal-specs {
    margin: 0 0 1.75rem;
    display: grid;
    grid-template-columns: max-content 1fr;
    gap: 0.55rem 1.1rem;
    font-size: 0.92rem;
  }
  .print-modal-specs dt {
    opacity: 0.6;
    font-size: 0.78rem;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    align-self: center;
  }
  .print-modal-specs dd { margin: 0; opacity: 0.95; align-self: center; }
  .print-modal-cta {
    display: inline-block;
    padding: 0.75rem 1.25rem;
    border: 1px solid currentColor;
    border-radius: 6px;
    text-decoration: none;
    font-size: 0.95rem;
    align-self: flex-start;
    margin-top: auto;
    transition: opacity .2s ease, background .2s ease, color .2s ease;
  }
  .print-modal-cta:hover {
    background: #fafafa; color: #0a0a0a; opacity: 1;
  }
  .print-modal-close {
    position: absolute;
    top: 0.5rem; right: 0.5rem;
    z-index: 2;
    background: rgba(0,0,0,0.5);
    color: #fafafa;
    border: 1px solid rgba(255,255,255,0.15);
    width: 2.25rem; height: 2.25rem;
    border-radius: 50%;
    font-size: 1.5rem; line-height: 1;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: background .2s ease;
  }
  .print-modal-close:hover { background: rgba(255,255,255,0.15); }
  @media (max-width: 720px) {
    .print-modal-dialog {
      grid-template-columns: 1fr;
      max-height: calc(100vh - 1rem);
      overflow-y: auto;
    }
    .print-modal-image-wrap { min-height: 40vh; max-height: 55vh; }
    .print-modal-info { padding: 1.5rem 1.25rem; }
    .print-modal-title { font-size: 1.6rem; }
  }
</style>
