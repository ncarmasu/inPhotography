<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 200" role="img" aria-label="INPhotography">
  <defs>
    <linearGradient id="badge-stroke" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e4dff5" stop-opacity="0.88"/>
      <stop offset="5%" stop-color="#e7a780" stop-opacity="0.9"/>
      <stop offset="14%" stop-color="#d9b4d2" stop-opacity="0.88"/>
      <stop offset="22%" stop-color="#efc7a6" stop-opacity="0.85"/>
      <stop offset="35%" stop-color="#afa0d4" stop-opacity="0.82"/>
      <stop offset="50%" stop-color="#7f769b" stop-opacity="0.65"/>
      <stop offset="65%" stop-color="#afa0d4" stop-opacity="0.82"/>
      <stop offset="78%" stop-color="#efc7a6" stop-opacity="0.85"/>
      <stop offset="86%" stop-color="#d9b4d2" stop-opacity="0.88"/>
      <stop offset="95%" stop-color="#e7a780" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#e4dff5" stop-opacity="0.88"/>
    </linearGradient>
    <filter id="badge-glow" x="-20%" y="-20%" width="140%" height="140%" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="2.2" result="blur"/>
      <feFlood flood-color="#d6b7cd" flood-opacity="0.16" result="tint"/>
      <feComposite in="tint" in2="blur" operator="in" result="glow"/>
      <feMerge>
        <feMergeNode in="glow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- Badge landscape 5:4 (135x108) -->
  <rect x="22.5" y="46" width="135" height="108" rx="11" fill="none" stroke="url(#badge-stroke)" stroke-width="1.5" filter="url(#badge-glow)"/>
  <line x1="48" y1="100" x2="67" y2="100" stroke="#fafafa" stroke-width="1.5" opacity="0.5"/>
  <line x1="116" y1="100" x2="128" y2="100" stroke="#fafafa" stroke-width="1.5" opacity="0.5"/>
  <text x="90" y="96" text-anchor="middle" dominant-baseline="central"
        font-family="'Didot', 'Bodoni 72', 'Playfair Display', 'Cormorant Garamond', 'Times New Roman', serif"
        font-style="italic" font-weight="400" font-size="72" letter-spacing="1" fill="#fafafa">IN</text>
  <line x1="180" y1="55" x2="180" y2="145" stroke="#fafafa" stroke-width="1" opacity="0.4"/>
  <text x="205" y="100" dominant-baseline="central"
        font-family="'Didot', 'Bodoni 72', 'Playfair Display', 'Cormorant Garamond', 'Times New Roman', serif"
        font-style="italic" font-weight="400" font-size="44" letter-spacing="4" fill="#fafafa" opacity="0.7">Photography</text>
</svg>
