<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 200" role="img" aria-label="INPhotography combination logo">
  <!-- Monogram badge: 4:5 ratio (96x120) -->
  <rect x="32" y="40" width="96" height="120" rx="10" fill="none" stroke="currentColor" stroke-width="1.5" opacity="0.85"/>
  <line x1="46" y1="100" x2="60" y2="100" stroke="currentColor" stroke-width="1" opacity="0.5"/>
  <line x1="100" y1="100" x2="114" y2="100" stroke="currentColor" stroke-width="1" opacity="0.5"/>
  <text x="80" y="100"
        text-anchor="middle"
        dominant-baseline="central"
        font-family="'Didot', 'Bodoni 72', 'Playfair Display', 'Cormorant Garamond', 'Times New Roman', serif"
        font-style="italic"
        font-weight="400"
        font-size="68"
        letter-spacing="1"
        fill="currentColor">IN</text>
  <!-- Vertical separator -->
  <line x1="160" y1="55" x2="160" y2="145" stroke="currentColor" stroke-width="1" opacity="0.4"/>
  <!-- Wordmark -->
  <text x="185" y="100"
        dominant-baseline="central"
        font-family="'Didot', 'Bodoni 72', 'Playfair Display', 'Cormorant Garamond', 'Times New Roman', serif"
        font-style="italic"
        font-weight="400"
        font-size="44"
        letter-spacing="4"
        fill="currentColor"
        opacity="0.7">Photography</text>
</svg>
